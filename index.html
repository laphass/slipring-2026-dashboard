  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected

  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

}

    &lt;label class=&quot;form-label&quot; for=&quot;history-equipment&quot;&gt;Equipment&lt;select class=&quot;form-select&quot; id=&quot;history-equipment&quot;&gt;&lt;/select&gt;&lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;history-position&quot;&gt;ตำแหน่ง&lt;select class=&quot;form-select&quot; id=&quot;history-position&quot;&gt;&lt;/select&gt;&lt;/label&gt;
  &lt;/div&gt;
  &lt;div id=&quot;history-summary&quot; class=&quot;card&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;text-small&quot;&gt;ข้อมูลถึงกรกฎาคม 2026 · สิงหาคม–กันยายนยังไม่มีรายงาน&lt;/p&gt;
  &lt;h3&gt;จำนวนแปรงถ่านที่เปลี่ยนรายเดือน (ก้อน)&lt;/h3&gt;
  &lt;div id=&quot;history-line&quot;&gt;&lt;/div&gt;
  &lt;details id=&quot;monthly-drill&quot;&gt;&lt;summary&gt;ดูรายการเปลี่ยนรายเดือน&lt;/summary&gt;
  &lt;label class=&quot;form-label&quot; for=&quot;history-detail-month&quot;&gt;เลือกเดือนหรือกดจุดบนกราฟเพื่อดูรายละเอียด&lt;select id=&quot;history-detail-month&quot; class=&quot;form-select&quot;&gt;&lt;/select&gt;&lt;/label&gt;

  &lt;div id=&quot;history-month-breakdown&quot;&gt;&lt;/div&gt;
  &lt;/details&gt;
  &lt;details id=&quot;trend-details&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;ดูประวัติทั้งหมดและแหล่งข้อมูล&lt;/summary&gt;
  &lt;div class=&quot;text-small&quot;&gt;ยอดสะสม = ผลรวมรายการตั้งแต่มกราคมถึงเดือนนั้น · เดือนที่ไม่มี PDF ไม่แสดงเป็น 0&lt;/div&gt;
  &lt;p class=&quot;text-small&quot;&gt;ยอดสะสมจากรายงาน ม.ค.–ก.ค. 2026 ตามชื่อ Equipment / ตำแหน่ง ไม่ใช่ประวัติตลอดอายุของมอเตอร์ · วันที่เปลี่ยนจริงไม่ได้ระบุใน PDF; วันที่ด้านล่างเป็น Reported Date ในตารางหลักเท่านั้น&lt;/p&gt;
  &lt;div class=&quot;text-small&quot;&gt;บนหน้าจอเล็ก เลื่อนตารางแนวนอนเพื่อดูข้อมูลครบทุกช่อง&lt;/div&gt;
  &lt;div class=&quot;table-responsive&quot;&gt;&lt;table id=&quot;history-table&quot; class=&quot;table table-sm&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;รายงาน&lt;/th&gt;&lt;th&gt;Equipment / ตำแหน่ง&lt;/th&gt;&lt;th&gt;ชนิด&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;ก้อน&lt;/th&gt;&lt;th&gt;วันที่บันทึก&lt;br&gt;(ไม่ใช่วันเปลี่ยนที่ยืนยัน)&lt;/th&gt;&lt;th&gt;หมายเหตุ&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody id=&quot;history-rows&quot;&gt;&lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;วิธีอ่านประวัติและตรวจสอบแหล่งข้อมูล&lt;/summary&gt;&lt;ul&gt;&lt;li&gt;แต่ละแถวถอดจากตาราง “รายการสรุปที่ได้เปลี่ยน” หน้า 1 ของ PDF ชื่อไฟล์แสดงในช่องรายงาน&lt;/li&gt;&lt;li&gt;คำว่า “ล่าสุด” หมายถึงเดือนรายงานล่าสุดที่มีบันทึก ไม่ใช่วันเปลี่ยนจริง ไม่มีการใช้วันพิมพ์หรือกำหนด PM ครั้งถัดไปเป็นวันเปลี่ยน&lt;/li&gt;&lt;li&gt;S1 ในตารางเปลี่ยนไม่ได้แยก HD/TE; วันที่นำมาแสดงอ้างอิง S1 (HD) ที่ตำแหน่งตรงกันในเดือนนั้น&lt;/li&gt;&lt;li&gt;รายการที่ตำแหน่งหรือชนิดแปรงถ่านไม่สอดคล้องกันคงชื่อตามตารางเปลี่ยน และไม่ยืนยันวันที่เชื่อมโยง&lt;/li&gt;&lt;li&gt;C1 MD-1 เดือนมิถุนายนมี 2 แถว (2 และ 1 ก้อน) เก็บไว้ทั้งสองแถว รวม 3 ก้อน ไม่ตีความว่าเปลี่ยนคนละวัน&lt;/li&gt;&lt;li&gt;ยอดเป็นผลรวมตามรายงาน ไม่ได้ยืนยันกับใบงานเพื่อคัดรายการซ้ำข้ามเดือน และไม่ได้ผูก Serial Number เพราะตารางเปลี่ยนไม่ระบุหมายเลขมอเตอร์&lt;/li&gt;&lt;li&gt;ตำแหน่งที่ไม่พบรายการแสดง “ไม่พบบันทึกการเปลี่ยนในชุดรายงาน” ไม่ใช่ยืนยันว่าไม่เคยเปลี่ยน&lt;/li&gt;&lt;/ul&gt;&lt;/details&gt;
  &lt;/details&gt;
  &lt;/section&gt;
  &lt;hr&gt;
  &lt;details class=&quot;secondary-section&quot;&gt;&lt;summary&gt;ผลตรวจเชิงเทคนิคและกราฟ Trend · กรกฎาคมพบ 5 จุดต่ำกว่า 25 มม.&lt;/summary&gt;
  &lt;h3&gt;จุดต่ำกว่าเกณฑ์ในรายงานกรกฎาคม&lt;/h3&gt;
  &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;
    &lt;thead&gt;&lt;tr&gt;&lt;th&gt;มอเตอร์&lt;/th&gt;&lt;th&gt;ตำแหน่ง / ความยาว (มม.)&lt;/th&gt;&lt;th&gt;สถานะหลักฐาน&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
    &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;B3 MD-1&lt;/td&gt;&lt;td&gt;L3 19.75 · L5 24.11&lt;br&gt;M2 23.30 · M3 20.42&lt;/td&gt;&lt;td&gt;4 จุด &amp;lt;25 มม.&lt;br&gt;มีบันทึกเปลี่ยน 4 ชิ้น&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;C1 MD-1&lt;/td&gt;&lt;td&gt;M5 23.15&lt;/td&gt;&lt;td&gt;1 จุด &amp;lt;25 มม.&lt;br&gt;มีบันทึกเปลี่ยน 3 ชิ้น&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
  &lt;/table&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small&quot;&gt;สถานะหลังเปลี่ยน: ยังไม่ยืนยันจากรายงาน · วันตรวจทั้งสองรายการ 5 ส.ค. 2026&lt;/div&gt;
  &lt;hr&gt;
  &lt;h3&gt;แนวโน้มผลตรวจรายเดือน&lt;/h3&gt;
  &lt;div id=&quot;inspection-trends&quot; class=&quot;inspection-trends&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small&quot;&gt;ความยาว: ใช้ค่าต่ำสุดในคอลัมน์ Min · ฉนวน: ใช้คอลัมน์ After โดยแปลง GΩ เป็น MΩ · ไม่มีเกณฑ์ตัดสินผ่าน/ไม่ผ่านฉนวนในเอกสาร&lt;/div&gt;
  &lt;h3&gt;รายละเอียดรายเดือน&lt;/h3&gt;
  &lt;div id=&quot;slipring-details&quot;&gt;&lt;/div&gt;
  &lt;hr&gt;
  &lt;/details&gt;
  &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;ขอบเขตข้อมูลและข้อควรตรวจสอบ&lt;/summary&gt;
    &lt;ul&gt;&lt;li&gt;จัดเดือนตามหัวรายงาน ไม่ใช่เดือนของวันตรวจหรือวันพิมพ์ รายงานบางฉบับมีวันตรวจข้ามเดือน&lt;/li&gt;&lt;li&gt;รายการมีผลตรวจคือแถวที่มีค่าความยาวและค่าฉนวน ไม่ใช่อัตราทำ PM สำเร็จ และไม่ใช่จำนวนมอเตอร์ไม่ซ้ำ&lt;/li&gt;&lt;li&gt;ใช้เกณฑ์เปลี่ยนแปรงถ่าน &amp;lt;25 มม. ตามคำอธิบายในแบบฟอร์ม ค่าเท่ากับ 25.00 มม. แยกไว้เป็นจุดชิดเกณฑ์&lt;/li&gt;&lt;li&gt;จำนวนเปลี่ยนอ้างอิงแถว “เปลี่ยนครั้งนี้” ยอดคงเหลือเป็นตัวเลขตามรายงาน ยังไม่ตรวจสอบกับทะเบียนเบิกจ่าย&lt;/li&gt;&lt;li&gt;เมษายน S2A MD-4 ระบุ 81.8 GΩ; พฤษภาคม 144.2 GΩ และกรกฎาคม 182.7 GΩ ขณะที่หลายเดือนระบุหน่วย MΩ ควรยืนยันหน่วยก่อนใช้วิเคราะห์แนวโน้มฉนวน&lt;/li&gt;&lt;li&gt;ชื่อ Equipment / Position บางรายการเปลี่ยนระหว่างเดือน การติดตามมอเตอร์รายตัวควรยึด Serial Number ร่วมด้วย&lt;/li&gt;&lt;li&gt;ไม่พบรายงานสิงหาคม–ธันวาคมในโฟลเดอร์ที่อ่าน จึงไม่แสดงเป็นผลตรวจศูนย์&lt;/li&gt;&lt;/ul&gt;
  &lt;/details&gt;
&lt;/div&gt;

/* Reference-inspired standalone dashboard */
html,body{background:#f2f2f2!important;color:#565656!important;font-family:&quot;Segoe UI&quot;,Tahoma,sans-serif!important}
#slipring-2026{--background:#f2f2f2;--foreground:#4f4f4f;--muted:#e4e4e4;--border:#d8d8d8;--viz-series-1:#12a4ca;--viz-series-2:#d50c8b;--viz-series-3:#d6ce08;--viz-series-4:#5b5b5b;--viz-series-5:#229ca5;--viz-series-6:#958aaf;--ring:#12a4ca;max-width:1440px;margin:auto;padding:32px 40px;color:#565656;font:15px/1.65 &quot;Segoe UI&quot;,Tahoma,sans-serif}
#slipring-2026 *{box-sizing:border-box}
#slipring-2026 [hidden]{display:none!important}
#slipring-2026 h2{font-size:28px;font-weight:650;letter-spacing:.04em;margin:0}
#slipring-2026 h3{font-size:19px;font-weight:600;margin:18px 0;color:#595959}
#slipring-2026 .dashboard-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}
#slipring-2026 .eyebrow{color:#149fbe;font-size:12px;letter-spacing:.14em;font-weight:650}
#slipring-2026 .report-badge{font-size:13px;color:#777}
#slipring-2026 .overview-grid{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:28px;margin-bottom:48px}
#slipring-2026 .overview-card{background:white;border-radius:42px;padding:26px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px}
#slipring-2026 .overview-card h3{margin:6px 0;font-size:18px}
#slipring-2026 .overview-card p{font-size:12px;margin:6px 0;color:#757575}
#slipring-2026 .metric-symbol{font-size:40px;line-height:1.1;color:#12a4ca}
#slipring-2026 .hero-value{font-size:56px;line-height:1.3;font-weight:500;color:#12a4ca}
#slipring-2026 .type-card{align-items:stretch;text-align:left}
#slipring-2026 .type-card h3{text-align:center;margin-bottom:24px}
#slipring-2026 .type-row{display:flex;align-items:center;gap:12px;margin:8px 0;font-weight:600}
#slipring-2026 .type-row&gt;span{min-width:65px}
#slipring-2026 .type-row&gt;div{padding:4px 12px;text-align:right;color:white;min-width:48px}
#slipring-2026 section{margin:40px 0}
#slipring-2026 #month-title,#slipring-2026 #history-title{text-align:center;font-size:20px;margin:30px 0 16px}
#slipring-2026 label[for=&quot;report-month&quot;]{display:block;max-width:410px;margin:0 auto;text-align:center;text-transform:uppercase}
#slipring-2026 select{font:inherit;color:#159fc1;background:#fff;border:1px solid #ddd;border-radius:9px;padding:10px 14px;width:100%;height:auto}
#slipring-2026 #report-month{font-size:25px;text-align:center;border:0;background:transparent;font-weight:500}
#slipring-2026 label[for=&quot;report-month&quot;]+p{text-align:center;color:#777}
#slipring-2026 .monthly-comparison{display:grid;grid-template-columns:1fr;gap:42px;margin:38px 0}
#slipring-2026 .monthly-comparison h3{text-align:center;font-size:21px}
#slipring-2026 .column-chart{display:flex;gap:8px;align-items:flex-end;border-bottom:2px solid #ddd;height:218px;padding:16px 0 0}
#slipring-2026 .column-item{flex:1;min-width:0;border:0;background:none;color:#555;font:600 12px &quot;Segoe UI&quot;,sans-serif;padding:0;cursor:pointer}
#slipring-2026 .column-plot{height:180px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:12px}
#slipring-2026 .column-bar{display:block;position:relative;width:80%;min-height:2px;max-width:38px}
#slipring-2026 .column-value{position:absolute;top:-24px;left:50%;transform:translateX(-50%);color:#555;font-size:14px}
#slipring-2026 .chart-caption{text-align:center;font-size:13px;color:#777;margin:24px 0}
#slipring-2026 .chart-empty{height:218px;display:grid;place-items:center;color:#888}
#slipring-2026 #month-summary,#slipring-2026 #history-summary{background:white;border:0;border-left:7px solid #12a4ca;border-radius:8px;padding:18px 22px;font-size:16px;margin:22px 0}

#slipring-2026 #month-explore-layout{justify-content:center;padding:12px 0 26px}
#slipring-2026 #month-donut{width:280px}

#slipring-2026 #month-selected-panel{background:#fff;padding:22px;border-radius:18px}

#slipring-2026 .viz-controls label{flex:1;min-width:0;text-align:center}
#slipring-2026 #history-line{max-width:1100px;margin:25px auto}
#slipring-2026 #history-detail-month{max-width:360px;margin:8px 0}
#slipring-2026 .table{width:100%;border-collapse:collapse;font-size:14px}

#slipring-2026 .table-responsive{overflow-x:auto;margin:20px 0}
#slipring-2026 .equipment-matrix{background:white;border-radius:14px;overflow:hidden}
#slipring-2026 .equipment-matrix th{font-size:13px}
#slipring-2026 .matrix-cell{cursor:pointer}
#slipring-2026 #equipment-cell-detail{background:white;border-radius:16px;padding:22px;margin:20px 0}
#slipring-2026 details{margin:16px 0}#slipring-2026 summary{cursor:pointer;color:#58747b;padding:9px 0}
#slipring-2026 .btn{border:1px solid #ccc;background:white;color:#555;padding:7px 14px;border-radius:7px;cursor:pointer;font:inherit}
#slipring-2026 .text-small{font-size:12px;color:#777}#slipring-2026 hr{border:0;border-top:1px solid #ddd;margin:34px 0}
#slipring-2026 .sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@media(max-width:800px){#slipring-2026{padding:22px 16px}.dashboard-header{flex-direction:column;align-items:flex-start!important}#slipring-2026 .overview-grid{grid-template-columns:1fr 1fr;gap:14px}#slipring-2026 .type-card{grid-column:1/-1}#slipring-2026 .overview-card{border-radius:26px;min-height:190px;padding:18px 12px}#slipring-2026 .hero-value{font-size:44px}#slipring-2026 .monthly-comparison{grid-template-columns:1fr;gap:18px}#slipring-2026 .column-chart{gap:5px}#slipring-2026 .viz-controls{gap:12px}#slipring-2026 #month-donut-layout{justify-content:center}#slipring-2026 #month-donut-legend{min-width:150px}#slipring-2026 h2{font-size:24px}}

#slipring-2026 .cumulative-line-scroll{overflow-x:auto;background:#fff;border-radius:24px;padding:14px 8px 0}
#slipring-2026 .cumulative-area{display:block;font:12px &quot;Segoe UI&quot;,Tahoma,sans-serif;color:#595959}

#slipring-2026 .inspection-trends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin:24px 0}
#slipring-2026 .inspection-chart{min-width:0;background:#fff;border-radius:20px;padding:18px}
#slipring-2026 .inspection-chart h3{font-size:17px;margin:0 0 12px}

  monthSelect.innerHTML=monthNames.map((m,i)=&gt;`&lt;option value=&quot;${i}&quot;&gt;${m} 2026${i&gt;=rows.length?&#x27; — ยังไม่มี PDF&#x27;:&#x27;&#x27;}&lt;/option&gt;`).join(&#x27;&#x27;);

  const equipments=[...new Set(events.map(e=&gt;e.equipment))].sort((a,b)=&gt;a.localeCompare(b,undefined,{numeric:true}));
  equipmentSelect.innerHTML=&#x27;&lt;option value=&quot;all&quot;&gt;ทุก Equipment&lt;/option&gt;&#x27;+equipments.map(eq=&gt;`&lt;option value=&quot;${eq}&quot;&gt;${eq}&lt;/option&gt;`).join(&#x27;&#x27;);

  equipmentSelect.value=&#x27;all&#x27;;
  const renderMonth=()=&gt;{
    root.querySelector(&#x27;#month-selected-panel&#x27;).hidden=true;

    const total=list.reduce((s,e)=&gt;s+e.count,0);
    const columns=(host,cumulative)=&gt;{

      const vals=equipments.map(eq=&gt;({eq,n:events.filter(e=&gt;e.equipment===eq&amp;&amp;(cumulative?e.month&lt;=month:e.month===month)).reduce((n,e)=&gt;n+e.count,0)}));
      const max=Math.max(1,...vals.map(d=&gt;d.n));
      if(cumulative){
        const w=Math.max(600,root.querySelector(host).clientWidth-16),h=420,l=52,r=w-28,t=40,b=354,ceiling=Math.ceil(max/10)*10;
        const points=vals.map((d,i)=&gt;({...d,x:l+i*(r-l)/(vals.length-1),y:b-d.n/ceiling*(b-t)}));
